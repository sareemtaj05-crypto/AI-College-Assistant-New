<!DOCTYPE html>
<html>
<head>
    <title>AI Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .answer {
            margin-top: 25px;
            padding: 20px;
            background: #f3f4f6;
            border-radius: 8px;
            white-space: pre-wrap;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #111827;
        }
    </style>
</head>

<body>

<header>
    <h1>🤖 AI College Assistant</h1>
    <p>Ask your college-related questions</p>
</header>

<div class="container">

    <div class="card">

        <h2>Ask AI</h2>

        <form method="POST">
            {% csrf_token %}

            <textarea
                name="question"
                placeholder="Type your question here..."
                required
            ></textarea>

            <button type="submit">
                Ask AI
            </button>
        </form>

        {% if answer %}
            <div class="answer">
                <h3>🤖 AI Answer</h3>
                {{ answer }}
            </div>
        {% endif %}

        <a href="{% url 'dashboard' %}" class="back">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
